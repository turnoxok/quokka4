<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<script src="./tema.js?v=54"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cómo llegar</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#1e3a19" />
<style>
  :root{--bg:var(--t-1e3a19,#1e3a19);--ac:var(--t-b1c74d,#b1c74d)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:#fff;font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .weeb-back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:200;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font:600 .85rem 'Montserrat',system-ui,sans-serif;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .weeb-back:active{transform:scale(.96)}
  #mp{position:fixed;inset:0;width:100%;height:100%;border:0;background:#222}
  .ab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font:700 .9rem 'Montserrat',system-ui,sans-serif;text-decoration:none;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .vacio{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1rem;line-height:1.5}
</style>
</head>
<body>
<a class="weeb-back" href="./">← Volver al sitio</a>
<iframe id="mp" title="Mapa" loading="eager" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
<a class="ab" id="ab" href="#" target="_blank" rel="noopener" hidden>Abrir en Google Maps</a>
<div class="vacio" id="vacio">Todavía no está cargada la dirección del salón.</div>
<script>
(function(){
var emb=window.parent!==window;
document.querySelector('.weeb-back').addEventListener('click',function(e){if(emb){e.preventDefault();parent.postMessage('weeb-cerrar',location.origin)}});
var T=window.TEMA||{listo:Promise.resolve()};
function pintar(){
  var D=T.datosDemo&&T.datosDemo(),dir=D&&D.dir||(document.documentElement.getAttribute('data-dir')||''),mp=D&&D.maps||'';
  var f=document.getElementById('mp'),ab=document.getElementById('ab');
  if(!dir&&!mp){document.getElementById('vacio').style.display='flex';return}
  if(dir){f.src='https://www.google.com/maps?q='+encodeURIComponent(dir)+'&hl=es&z=16&output=embed';f.hidden=false}
  ab.href=mp||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dir));ab.hidden=false;
  if(!dir)location.replace(ab.href);
}
window.__pintarMapa=pintar;Promise.race([Promise.resolve(T.listo),new Promise(function(r){setTimeout(r,4000)})]).then(pintar,pintar);
})();
</script>
</body>
</html>
