      acordeon('d-venc','Próximos vencimientos',venc.length?String(venc.filter(function(v){return !v.hecho}).length)+' pendientes':'',vencBox),
      acordeon('d-pagos','Pagos',pagos.length?pagos.length+(pagos.length===1?' pago':' pagos'):'',h('div',null,seccionPagos),pagos.some(function(x){return x.estado==='revision'})),
      acordeon('d-hist','Historial','',histBox),sw?null:h('div',{style:'margin-top:1.4rem'},borrar));
  }).catch(function(e){if(e.message!=='sesion')app.replaceChildren(h('p',{class:'empty'},e.message),h('button',{class:'btn soft',onclick:lista},'Volver'))});
}

function ajustes(){
  var t=window.__transfer||{},fld=function(n,l,v){return h('label',{class:'field'},h('span',null,l),h('input',{name:n,type:'text',value:v||'',maxlength:'80'}))};
  var b=h('button',{class:'btn block'},'Guardar datos de cobro'),f=h('form',{class:'card',onsubmit:function(ev){ev.preventDefault();var x={};['alias','titular','banco','cbu','nota','mp'].forEach(function(k){x[k]=f.elements[k].value});run(b,function(){return call('adminConfig',x).then(function(c){window.__transfer=c;toast('Guardado. Ya lo ven los clientes.','ok')})})}},
    h('h3',{class:'sec',style:'margin-top:0'},'Datos para que te transfieran'),h('p',{class:'muted small'},'Esto es lo que ven los clientes en "Mi sitio web" cuando tienen que pagar. El link de Mercado Pago es lo principal; los datos de transferencia son opcionales.'),fld('alias','Alias',t.alias),fld('titular','Titular de la cuenta',t.titular),fld('cbu','CBU / CVU',t.cbu),fld('banco','Banco o billetera',t.banco),fld('mp','Link de pago de Mercado Pago (https://…)',t.mp),b);
  var n=h('input',{type:'password',placeholder:'Clave nueva (mínimo 10 caracteres)',autocomplete:'new-password'}),b2=h('button',{class:'btn block'},'Cambiar mi clave');
  var f2=h('form',{class:'card',style:'margin-top:1rem',onsubmit:function(ev){ev.preventDefault();run(b2,function(){return call('adminCambiarClave',{nueva:n.value}).then(function(){n.value='';toast('Clave cambiada','ok')})})}},
    h('h3',{class:'sec',style:'margin-top:0'},'Tu clave de administrador'),h('div',{style:'margin:.6rem 0'},n),b2);
  var gbox=h('div',{class:'card',style:'margin-top:1rem'},h('h3',{class:'sec',style:'margin-top:0'},'Permiso de GitHub'),h('p',{class:'muted small'},'Cargando…'));
  function pintarGh(e){var gt=h('input',{type:'password',placeholder:'Pegá acá el código de GitHub (github_pat_…)',autocomplete:'off'}),gb=h('button',{class:'btn block'},e.configurado?'Reemplazar el código':'Guardar el código');
    gb.onclick=function(){if(!gt.value.trim())return toast('Pegá el código','err');run(gb,function(){return call('adminGithubGuardar',{gh:gt.value}).then(function(d){gt.value='';toast('Listo: conectado con GitHub','ok');pintarGh(d)})})};
    gbox.replaceChildren(h('h3',{class:'sec',style:'margin-top:0'},'Permiso de GitHub'),
      h('p',{class:'muted small'},e.configurado?'Conectado con la cuenta «'+e.usuario+'». Con esto se crean solos los sitios de los clientes. El código queda guardado en el sistema y no se muestra.':'Todavía no está conectado. Con este permiso el admin crea solo el sitio de cada cliente, sin que tengas que entrar a GitHub.'),
      h('div',{style:'margin:.6rem 0'},gt),gb,e.configurado?h('div',{class:'acts'},h('button',{class:'btn sm line',style:'color:var(--bad)',type:'button',onclick:function(){var b=this;if(!confirm('¿Desconectar GitHub? Dejan de crearse solos los sitios nuevos.'))return;run(b,function(){return call('adminGithubQuitar').then(pintarGh)})}},'Desconectar')):null)}
  call('adminGithubEstado').then(pintarGh).catch(function(e){if(e.message!=='sesion')gbox.replaceChildren(h('p',{class:'empty'},e.message))});
  app.replaceChildren(h('button',{class:'btn sm line vol',onclick:lista},'← Volver'),f,gbox,f2);
}

/* Link directo al editor de un salón (?ed=<demo>): si ya hay sesión se abre el editor con guardar y publicar; si no, se pide la clave y se vuelve solo. */
var EDQ='';try{var _e=new URLSearchParams(location.search).get('ed')||'';if(/^[a-z0-9][a-z0-9-]{2,29}$/.test(_e.toLowerCase())){EDQ=_e.toLowerCase();sessionStorage.setItem('tw-ed',EDQ)}else EDQ=sessionStorage.getItem('tw-ed')||''}catch(e){}
function edBase(s){var w=String(s.web||'').trim();if(s.etapa==='cliente'&&w&&!/\s/.test(w)){if(!/^https?:\/\//i.test(w))w='https://'+w;return w.replace(/[?#].*$/,'').replace(/\/?$/,'/')+'editor.html'}return '../editor.html'}
function irEditor(){if(!EDQ||!token)return false;try{sessionStorage.removeItem('tw-ed')}catch(e){}location.replace('../editor.html?d='+encodeURIComponent(EDQ)+'&v='+Math.floor(Date.now()/600000)+'#t='+encodeURIComponent(token));return true}
if(token){if(!irEditor())lista()}else login();
})();
</script>
